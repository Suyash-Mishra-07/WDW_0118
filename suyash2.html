<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links and images</title>
</head>
<body>
    <!-- if we have to make a website with important links that we want to embedd then we use anchor tag <a href ="" https://google.com">go to google</a> -->
     <!-- par ye websites abhi humari same tab pe khul rahi hain to agr hume chahte hain ki humari sites doosre tab pe khule to hum target="_blank" attribute use karenge (like meta is a tag and charset is its attribute) -->

    <a href= "https://google.com" target="_blank">go to google</a>
    <a href= "https://twitter.com" target="_blank">go to  twitter</a>
    <a href= "https://facebook.com" target="_blank"> go to facebook </a>


    <!-- aur apni vs code ki files ka link bhi hum daal sakte hain isme hum -->

     <a href="/suyash.html " target="_blank"> go to my file</a>

     <!-- for inserting image <img src="" alt=""> is used where src means source from where you are taking your image(like from internet or your local file ) and alt is used to show when user's  internet connection is slow or any other error -->
      <!-- here image file iis not present hencee alt message is shown on webpage -->

      <img src="suyash.jpg" alt="error loading image">

      <!-- we can change image width and height too by using width and height attributes -->
