<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABLES AND LISTS</title>
</head>
<body>
    <!-- <ul></ul> gives unordered list(like with bullets.) and <ol></ol> gives ordered lists (like 1 2 3 in points) -->
     <!-- similarily serial of unordered list can be disc square or circle  -->

     <ul type="square">
        <li>element 1</li>
        <li>element 2</li>
        <li>element 3</li>
    </ul>

    <!-- type attribute is used to choose the numbering of lines whether we want  serial number in 1 2 3 4 or in roman numbers(use I for capital roman no and i for small roman no.) or in alphabets -->

     <ol type="A">
        <li>ELEMENT 1</li>
        <li>ELEMENT 2</li>
        <li>ELEMENT 3</li>
       </ol>

       <!-- for list inside a list -->

       <ul type="A">
        <li>element 1</li>
        <li>
            <ol>
                <li>ELEMENT 1</li>
            </ol>
            </li>

           </ul>

           <!-- <table></table> for making table in html -->
            <h3>HTML TABLE</h3>
            <!-- used <thead></thead> for the headings of the table and to write these headings in table we use <th></th> tag and for writing in row we have used <tr></tr> tag and we have used <tbody></tbody> tag for filling the elements in thee table by using <td></td> tag and same <tr></tr> tag for row wise filling  -->
            <table>
                <thead>
                    <tr>
                    <th>EMPLOYEE NAME</th>
                    <th>EMPLOYEE</th>
                    <th>ROLE</th>
                </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>suyash</td>
                        <td>4674</td>
                        <td>programmer</td>
                    </tr>
                    <tr>
                        <td>vishakha</td>
                        <td>4675</td>
                        <td>developer</td>
                    </tr>
                    <tr>
                        <td>harshii</td>
                        <td>4676</td>
                        <td>gamer</td>
                    </tr>
                </tbody>


            </table>
    
</body>
</html>
